# Production Environment Properties
server.port=${PORT:8080}

# PostgreSQL Database Configuration via Environment Variables
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/dailybasket_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a6747f3c126d7da49be8a2968efc965762043a0ccf72e2c86e0216674e62040f1eb2e4b96ef32697a5a8d014082dc879da7342d48e3829dc72d555003b5ec98}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173,http://localhost:80,https://*}

logging.level.com.dailybasket=INFO
logging.level.org.springframework.security=WARN
